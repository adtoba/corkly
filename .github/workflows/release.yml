name: Release

# Builds the Mac (.dmg/.zip) and Windows (.exe) installers and uploads them to a GitHub Release.
# Trigger it by pushing a version tag:   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Make sure there is ONE draft release for this version before the Mac and Windows builds start,
  # so both upload into the same release (no race, no "release already published" skips).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create or reopen the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Corkly ${TAG#v}" --notes-file build/release-notes.md
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
          # Optional secrets — leave them unset until you have certificates.
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          EXTRA=""
          # Only hand signing settings to electron-builder when they actually exist —
          # an empty CSC_LINK makes it try to read the project folder as a certificate.
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "$MAC_CERT_P12_BASE64" ]; then
              export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            else
              echo "No Mac certificate yet - ad-hoc signing (users click 'Open Anyway' once)"
              # "-" = ad-hoc signature, which Apple Silicon needs for the app to launch at all.
              # Hardened runtime is for notarized builds only; with ad-hoc signing it blocks Electron from loading.
              EXTRA="-c.mac.identity=- -c.mac.hardenedRuntime=false"
            fi
            if [ -n "$APPLE_ID_SECRET" ]; then
              export APPLE_ID="$APPLE_ID_SECRET" APPLE_APP_SPECIFIC_PASSWORD="$APPLE_PASSWORD_SECRET" APPLE_TEAM_ID="$APPLE_TEAM_SECRET"
            fi
          else
            if [ -n "$WIN_CERT_P12_BASE64" ]; then
              export WIN_CSC_LINK="$WIN_CERT_P12_BASE64" WIN_CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          npx electron-builder ${{ matrix.platform }} --publish always $EXTRA

  # Once both installers are uploaded, make the release public.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
